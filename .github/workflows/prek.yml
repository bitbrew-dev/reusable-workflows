name: pre-commit-prek

on:
  workflow_call:
    inputs:
      image_version:
        description: prek Docker image version
        required: false
        default: latest
        type: string
      history_depth:
        description: 0 means fetch the full history
        required: false
        default: 0
        type: number
      run_all_files:
        description: Run on all files instead of files changed in the pull request
        required: false
        default: false
        type: boolean
      check_pr_title:
        description: Check the pull request title with the commit-msg hook
        required: false
        default: true
        type: boolean
      run_on_merge:
        description: Run on all files after a merge to the default branch
        required: false
        default: true
        type: boolean
      go_version_file:
        description: File from which actions/setup-go reads the Go version
        required: false
        default: go.mod
        type: string
      prek_skip:
        description: hook id, files, stage to skip in the prek run
        required: false
        default: ""
        type: string

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/bitbrew-dev/reusable-workflows/pre-commit:${{ inputs.image_version }}
    env:
      CHECK_PR_TITLE: ${{ inputs.check_pr_title }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREK_SKIP: ${{ inputs.prek_skip }}
      RUN_ALL_FILES: ${{ inputs.run_all_files }}
      RUN_ON_MERGE: ${{ inputs.run_on_merge }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.history_depth }}

      - name: Set up Go and restore Go caches
        if: hashFiles(inputs.go_version_file) != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Restore Rust caches
        if: hashFiles('**/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: prek
          save-if: >-
            ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-on-failure: false

      - name: Restore prek hook cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml', '.prek-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Prepare test environment
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "${{ github.actor }}@bitbrew.dev"
          git config --global user.name "${{ github.actor }}"
          prek install
          prek install --hook-type commit-msg

      - name: Run prek on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ "$RUN_ALL_FILES" == "true" ]]; then
            prek run --all-files
          else
            prek run \
              --from-ref "${{ github.event.pull_request.base.sha }}" \
              --to-ref "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Run prek on the default branch
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          inputs.run_on_merge
        run: prek run --all-files

      - name: Check pull request title
        if: github.event_name == 'pull_request' && inputs.check_pr_title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf "Checking PR title: '%s'\n" "$PULL_REQUEST_TITLE"
          git commit --allow-empty -m "$PULL_REQUEST_TITLE"
